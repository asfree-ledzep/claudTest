<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>계산기</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 30%, #1a1030 0%, #0a0810 100%);
      font-family: 'Inter', 'Segoe UI', sans-serif;
      perspective: 1000px;
    }

    .scene {
      animation: floatIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .calculator {
      width: 320px;
      background: linear-gradient(160deg, #2a2440 0%, #1a1628 60%, #120f1e 100%);
      border-radius: 24px;
      padding: 24px 20px 20px;
      box-shadow:
        0 2px 0 #0a0810,
        0 4px 0 #080610,
        0 6px 0 #060410,
        0 8px 0 #04030c,
        0 12px 30px rgba(0,0,0,0.8),
        0 30px 60px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.12),
        inset 0 -1px 0 rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.08);
    }

    /* 측면 두께 효과 */
    .calculator::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, transparent 50%);
      pointer-events: none;
    }

    .display {
      background: linear-gradient(180deg, #0c0a14 0%, #100d1c 100%);
      border-radius: 14px;
      padding: 18px 16px 14px;
      margin-bottom: 18px;
      text-align: right;
      box-shadow:
        inset 0 2px 8px rgba(0,0,0,0.8),
        inset 0 1px 0 rgba(0,0,0,0.5),
        0 1px 0 rgba(255,255,255,0.06);
      border: 1px solid rgba(0,0,0,0.6);
    }

    .display .expression {
      color: #4a4460;
      font-size: 12px;
      min-height: 18px;
      margin-bottom: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-shadow: none;
    }

    .display .result {
      color: #ddd8ff;
      font-size: 40px;
      font-weight: 300;
      letter-spacing: -0.02em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-shadow: 0 0 20px rgba(160,140,255,0.3);
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    /* 3D 버튼 공통 */
    button {
      position: relative;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      padding: 17px 0;
      letter-spacing: 0.01em;
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.08s ease;
      transform: translateZ(0);
      outline: none;
    }

    button:hover {
      filter: brightness(1.15);
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(3px) !important;
      filter: brightness(0.9);
    }

    /* 숫자 버튼 */
    .btn-number {
      background: linear-gradient(180deg, #2e2848 0%, #221e38 100%);
      color: #d0ccf0;
      box-shadow:
        0 4px 0 #0f0d1e,
        0 5px 0 #0a0814,
        0 8px 16px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.12),
        inset 0 -1px 0 rgba(0,0,0,0.3);
    }

    .btn-number:active {
      box-shadow:
        0 1px 0 #0f0d1e,
        0 2px 8px rgba(0,0,0,0.4),
        inset 0 2px 4px rgba(0,0,0,0.4);
    }

    /* 연산자 버튼 */
    .btn-operator {
      background: linear-gradient(180deg, #3a2e7a 0%, #2a2060 100%);
      color: #a89dff;
      box-shadow:
        0 4px 0 #130f38,
        0 5px 0 #0e0a28,
        0 8px 16px rgba(80,60,180,0.3),
        inset 0 1px 0 rgba(255,255,255,0.15),
        inset 0 -1px 0 rgba(0,0,0,0.3);
    }

    .btn-operator:active {
      box-shadow:
        0 1px 0 #130f38,
        0 2px 8px rgba(80,60,180,0.3),
        inset 0 2px 4px rgba(0,0,0,0.4);
    }

    .btn-operator.active {
      background: linear-gradient(180deg, #7b6ef5 0%, #5b50e8 100%);
      color: #fff;
      box-shadow:
        0 4px 0 #2a20a0,
        0 8px 20px rgba(100,80,240,0.5),
        inset 0 1px 0 rgba(255,255,255,0.25),
        inset 0 -1px 0 rgba(0,0,0,0.2);
      text-shadow: 0 0 12px rgba(255,255,255,0.5);
    }

    /* 등호 버튼 */
    .btn-equal {
      background: linear-gradient(180deg, #7b6ef5 0%, #5040d8 100%);
      color: #fff;
      font-weight: 600;
      box-shadow:
        0 4px 0 #2218a0,
        0 5px 0 #1a1280,
        0 8px 24px rgba(100,80,240,0.5),
        inset 0 1px 0 rgba(255,255,255,0.25),
        inset 0 -1px 0 rgba(0,0,0,0.2);
      text-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    .btn-equal:active {
      box-shadow:
        0 1px 0 #2218a0,
        0 4px 12px rgba(100,80,240,0.4),
        inset 0 2px 6px rgba(0,0,0,0.3);
    }

    /* AC 버튼 */
    .btn-clear {
      background: linear-gradient(180deg, #5a2828 0%, #401c1c 100%);
      color: #ff9090;
      box-shadow:
        0 4px 0 #200e0e,
        0 5px 0 #180a0a,
        0 8px 16px rgba(180,40,40,0.3),
        inset 0 1px 0 rgba(255,255,255,0.1),
        inset 0 -1px 0 rgba(0,0,0,0.3);
    }

    .btn-clear:active {
      box-shadow:
        0 1px 0 #200e0e,
        0 2px 8px rgba(180,40,40,0.3),
        inset 0 2px 4px rgba(0,0,0,0.4);
    }

    /* 특수 버튼 (+/-, %) */
    .btn-special {
      background: linear-gradient(180deg, #282438 0%, #1e1a2e 100%);
      color: #8880b0;
      box-shadow:
        0 4px 0 #0e0c18,
        0 5px 0 #0a0810,
        0 8px 16px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.08),
        inset 0 -1px 0 rgba(0,0,0,0.3);
    }

    .btn-special:active {
      box-shadow:
        0 1px 0 #0e0c18,
        0 2px 8px rgba(0,0,0,0.4),
        inset 0 2px 4px rgba(0,0,0,0.4);
    }

    .span-two { grid-column: span 2; }
  </style>
</head>
<body>
  <div id="error-toast" style="
    display:none; position:fixed; top:24px; left:50%; transform:translateX(-50%);
    background:#5a1a1a; color:#ff9090; border:1px solid #8b2a2a;
    border-radius:10px; padding:12px 24px; font-family:inherit;
    font-size:14px; box-shadow:0 4px 20px rgba(0,0,0,0.6); z-index:999;
  ">⚠ 연산자와 숫자를 먼저 입력하세요</div>

  <div class="scene">
  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="buttons">
      <button class="btn-clear" onclick="clearAll()">AC</button>
      <button class="btn-special" onclick="toggleSign()">+/-</button>
      <button class="btn-special" onclick="percent()">%</button>
      <button class="btn-operator" onclick="inputOperator('/')">÷</button>

      <button class="btn-number" onclick="inputNumber('7')">7</button>
      <button class="btn-number" onclick="inputNumber('8')">8</button>
      <button class="btn-number" onclick="inputNumber('9')">9</button>
      <button class="btn-operator" onclick="inputOperator('*')">×</button>

      <button class="btn-number" onclick="inputNumber('4')">4</button>
      <button class="btn-number" onclick="inputNumber('5')">5</button>
      <button class="btn-number" onclick="inputNumber('6')">6</button>
      <button class="btn-operator" onclick="inputOperator('-')">−</button>

      <button class="btn-number" onclick="inputNumber('1')">1</button>
      <button class="btn-number" onclick="inputNumber('2')">2</button>
      <button class="btn-number" onclick="inputNumber('3')">3</button>
      <button class="btn-operator" onclick="inputOperator('+')">+</button>

      <button class="btn-number span-two" onclick="inputNumber('0')">0</button>
      <button class="btn-number" onclick="inputDot()">.</button>
      <button class="btn-equal" onclick="calculate()">=</button>
    </div>
  </div>
  </div>

  <script>
    let current = '0';
    let previous = '';
    let operator = null;
    let shouldReset = false;

    const resultEl = document.getElementById('result');
    const expressionEl = document.getElementById('expression');

    function updateDisplay() {
      resultEl.textContent = current;
    }

    function inputNumber(num) {
      if (shouldReset) {
        current = num;
        shouldReset = false;
      } else {
        current = current === '0' ? num : current + num;
        if (current.length > 12) current = current.slice(0, 12);
      }
      updateDisplay();
    }

    function inputDot() {
      if (shouldReset) {
        current = '0.';
        shouldReset = false;
      } else if (!current.includes('.')) {
        current += '.';
      }
      updateDisplay();
    }

    function inputOperator(op) {
      if (operator && !shouldReset) {
        calculate(true);
      }
      previous = current;
      operator = op;
      shouldReset = true;
      const symbols = { '/': '÷', '*': '×', '-': '−', '+': '+' };
      expressionEl.textContent = `${previous} ${symbols[op]}`;
      document.querySelectorAll('.btn-operator').forEach(b => b.classList.remove('active'));
      const map = { '/': '÷', '*': '×', '-': '−', '+': '+' };
      document.querySelectorAll('.btn-operator').forEach(b => {
        if (b.textContent === map[op]) b.classList.add('active');
      });
    }

    function showError(msg) {
      const toast = document.getElementById('error-toast');
      toast.textContent = '⚠ 에러: ' + msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    function calculate(chained = false) {
      try {
        if (!operator || !previous) return;
        const a = parseFloat(previous);
        const b = parseFloat(current);
        let result;

        switch (operator) {
          case '+': result = a + b; break;
          case '-': result = a - b; break;
          case '*': result = a * b; break;
          case '/':
            if (b === 0) { current = '오류'; operator = null; previous = ''; updateDisplay(); return; }
            result = a / b;
            break;
        }

        const symbols = { '/': '÷', '*': '×', '-': '−', '+': '+' };
        if (!chained) {
          expressionEl.textContent = `${previous} ${symbols[operator]} ${current} =`;
          operator = null;
        }

        current = parseFloat(result.toPrecision(12)).toString();
        previous = current;
        shouldReset = true;
        document.querySelectorAll('.btn-operator').forEach(b => b.classList.remove('active'));
        updateDisplay();
      } catch (e) {
        showError(e.message);
      }
    }

    function clearAll() {
      current = '0';
      previous = '';
      operator = null;
      shouldReset = false;
      expressionEl.textContent = '';
      document.querySelectorAll('.btn-operator').forEach(b => b.classList.remove('active'));
      updateDisplay();
    }

    function toggleSign() {
      current = (parseFloat(current) * -1).toString();
      updateDisplay();
    }

    function percent() {
      current = (parseFloat(current) / 100).toString();
      updateDisplay();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') inputNumber(e.key);
      else if (e.key === '.') inputDot();
      else if (e.key === '+') inputOperator('+');
      else if (e.key === '-') inputOperator('-');
      else if (e.key === '*') inputOperator('*');
      else if (e.key === '/') { e.preventDefault(); inputOperator('/'); }
      else if (e.key === 'Enter' || e.key === '=') calculate();
      else if (e.key === 'Escape') clearAll();
      else if (e.key === 'Backspace') {
        if (current.length > 1) current = current.slice(0, -1);
        else current = '0';
        updateDisplay();
      }
    });
  </script>
</body>
</html>
